project_id = "puspadi-fellas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Deep link into the iOS app after the user taps the confirmation email.
# Mirror on hosted project: Dashboard → Authentication → URL Configuration
#   Site URL:      puspadi://auth/callback
#   Redirect URLs: puspadi://auth/callback
site_url = "puspadi://auth/callback"
additional_redirect_urls = ["puspadi://auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
# Require users to confirm email before they can sign in.
enable_confirmations = true
enable_signup = true
# Confirmation / magic-link tokens expire after this many seconds (default 3600).
otp_expiry = 3600

# Sign in with Apple — final call on Apple vs email/OTP is open, see
# docs/specs.md §8. Fill in client_id / secret via `supabase secrets set`
# once decided, do not commit real values here.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[storage]
enabled = true
# venue_imdf/{place_id}/*.json archives live in a bucket here — see
# docs/specs.md §4.6 and the functions/place-accessibility TODOs.

[edge_runtime]
enabled = true

# TODO: re-enable JWT before production — testing only so the iPhone / curl
# can hit the contribute endpoint with just the anon apikey (or no auth).
[functions.submit-accessibility-review]
verify_jwt = false

[functions.place-review-photos]
verify_jwt = false

[functions.my-reviews]
verify_jwt = false
