<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="280" height="300" class="slow"><style>.legs-a{animation:swA 1.1s ease-in-out infinite}.legs-b{animation:swB 1.1s ease-in-out infinite}.slow .legs-a,.slow .legs-b{animation-duration:1.6s}@keyframes swA{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}@keyframes swB{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite}.spin.fast{animation-duration:.9s}@keyframes spin{to{transform:rotate(360deg)}}.bob{animation:bob .55s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}.push{animation:push 1.8s ease-in-out infinite}@keyframes push{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}.crutch{animation:cr 1.3s ease-in-out infinite}@keyframes cr{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}.sweep{animation:sw 1.1s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
