<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="280" height="300"><style>.legs-a{animation:swA 1.1s ease-in-out infinite}.legs-b{animation:swB 1.1s ease-in-out infinite}.slow .legs-a,.slow .legs-b{animation-duration:1.6s}@keyframes swA{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}@keyframes swB{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite}.spin.fast{animation-duration:.9s}@keyframes spin{to{transform:rotate(360deg)}}.bob{animation:bob .55s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}.push{animation:push 1.8s ease-in-out infinite}@keyframes push{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}.crutch{animation:cr 1.3s ease-in-out infinite}@keyframes cr{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}.sweep{animation:sw 1.1s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
          <g class="legs-b" style="transform-origin:54px 92px"><path d="M54 92v50h9" stroke="#1F2D4D" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
          <g class="legs-a" style="transform-origin:54px 92px"><path d="M54 92v50h9" stroke="#2C3E66" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
          <g class="bob">
            <path d="M54 92V54" stroke="#fff" stroke-width="19" stroke-linecap="round"/>
            <circle cx="56" cy="36" r="11" fill="#8D5524"/>
            <path d="M45 33a11 11 0 0 1 22 0z" fill="#111"/>
            <rect x="55" y="33" width="14" height="5" rx="2" fill="#111"/>
            <path d="M56 62l12 16 6 6" stroke="#8D5524" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <g class="sweep" style="transform-origin:74px 84px"><path d="M74 84l44 58" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M110 131.5l8 10.5" stroke="#EF4136" stroke-width="4.5" stroke-linecap="round"/></g>
