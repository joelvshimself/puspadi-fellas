appId: ${APP_ID}
---
# Signed in from flow 03. Start Parking, answer, kill the app mid-form, then resume.
- setLocation:
    latitude: -8.7180
    longitude: 115.1700
- launchApp:
    arguments:
      ROLLSPOT_API_BASE_URL: ${API}
- extendedWaitUntil:
    visible: "Search a place"
    timeout: 20000
- openLink: "puspadifellas://place?place_id=${PLACE}"
- extendedWaitUntil:
    visible: "CONTRIBUTE"
    timeout: 15000
- tapOn: "CONTRIBUTE"
# A draft left by an earlier run resumes straight onto the question; otherwise start Parking.
- extendedWaitUntil:
    visible: "Help make every visit easier|Is there accessible parking\\?"
    timeout: 15000
- runFlow:
    when:
      visible: "Help make every visit easier"
    commands:
      - tapOn: "PARKING"
      - extendedWaitUntil:
          visible: "Take or upload a photo"
          timeout: 10000
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Is there accessible parking\\?"
    timeout: 10000
- tapOn: "No"
- takeScreenshot: 04a-answered
- stopApp
- launchApp:
    arguments:
      ROLLSPOT_API_BASE_URL: ${API}
- extendedWaitUntil:
    visible: "Your contribution is waiting"
    timeout: 20000
- takeScreenshot: 04b-banner
# The banner folds into the profile badge after 4s; Profile > Reviews then has the same row.
- extendedWaitUntil:
    notVisible: "Your contribution is waiting"
    timeout: 15000
- takeScreenshot: 04b2-folded
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Your contribution is waiting"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 04b3-profile-row
- tapOn: "Your contribution is waiting"
- extendedWaitUntil:
    visible: "Is there accessible parking\\?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 04c-resumed
